server {
    listen 80;
    server_name assistant.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name assistant.example.com;

    # 替换为自有域名及证书路径。
    ssl_certificate /etc/letsencrypt/live/assistant.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assistant.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 企业微信域名校验文件由部署者单独配置，不随仓库分发。

    # Vue 静态资源和各业务入口由 FastAPI 统一返回，不改变外部网址。
    location /assets/ {
        proxy_pass http://127.0.0.1:8787/assets/;
        proxy_set_header Host $host;
    }

    location ~ ^/(login|sidebar|sidebar-v2|review|records|users|change-password)(/|$) {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # 根网址进入客服宝管理后台。
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache";
    }
}
