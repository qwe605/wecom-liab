services:
  mysql:
    image: mysql:8.4
    container_name: kefubao-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kefubao}
      MYSQL_USER: ${MYSQL_USER:-kefubao}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kefubao_local_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kefubao_root_local_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-33069}:3306"
    volumes:
      - kefubao_mysql_data:/var/lib/mysql
      - ../../backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kefubao_mysql_data:
